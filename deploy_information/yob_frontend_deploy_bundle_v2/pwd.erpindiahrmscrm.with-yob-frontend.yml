
# Host paths for HRMS bench (product7)
x-host-paths: &host_paths
  HOST_ROOT: /srv/projects/shayona360
  HOST_SITES: /srv/projects/shayona360/sites
  HOST_LOGS: /srv/projects/shayona360/logs
  HOST_DB: /srv/projects/shayona360/db-data
  HOST_REDISQ: /srv/projects/shayona360/redis-queue-data
  HOST_YOB_FRONTEND: /srv/projects/shayona360/yob_frontend

services:
  # One-shot: copy bench code & sites from image to host (product7)
  init-code:
    image: yob/frappe-erpindiahrmscrm:v16
    user: "0:0"
    command:
      - bash
      - -lc
      - |
        set -e
        mkdir -p /workspace/sites /workspace/logs
        # Copy sites skeleton only if empty
        if [ -z "$(ls -A /workspace/sites 2>/dev/null)" ]; then
          cp -a /home/frappe/frappe-bench/sites/. /workspace/sites/
        fi
        chown -R 1000:1000 /workspace/apps /workspace/sites /workspace/logs || true
        echo "Init complete."
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/workspace/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/workspace/logs

  backend:
    image: yob/frappe-erpindiahrmscrm:v16
    networks:
      - frappe_network
    restart: on-failure
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/home/frappe/frappe-bench/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/home/frappe/frappe-bench/logs
      - /srv/backups/erpindiahrmscrm:/mnt/frappe-backups
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      FORWARDED_ALLOW_IPS: "*"

  configurator:
    image: yob/frappe-erpindiahrmscrm:v16
    networks:
      - frappe_network
    profiles: ["init"]
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/home/frappe/frappe-bench/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/home/frappe/frappe-bench/logs

  create-site:
    image: yob/frappe-erpindiahrmscrm:v16
    profiles: ["init"]
    networks:
      - frappe_network
    restart: "no"
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/home/frappe/frappe-bench/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=$(date +%s);
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( $(date +%s)-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1;
          fi;
        done;
        echo "sites/common_site_config.json found";
        bench new-site --mariadb-user-host-login-scope='%' \
          --admin-password="${SITE_ADMIN_PASSWORD}" \
          --db-root-username=root \
          --db-root-password="${MYSQL_ROOT_PASSWORD}" \
          --install-app erpnext \
          --install-app india_compliance \
          --install-app hrms \
          --install-app crm \
          --install-app telephony \
          --install-app helpdesk \
          --install-app shayona \
          --set-default manage.shayona360.com;

  db:
    image: mariadb:10.6
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
    restart: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${HOST_DB:-/srv/projects/shayona360/db-data}:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    depends_on: [db]
    networks: [frappe_network]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
      # PMA_ABSOLUTE_URI: http://localhost:8081/
      # PMA_ARBITRARY: 1
    ports:
      - "127.0.0.1:8081:80"  # bind to localhost for safety; change to "8081:80" if you need LAN access

  frontend:
    image: yob/frappe-erpindiahrmscrm:v16
    networks:
      - frappe_network
    depends_on:
      - websocket
    restart: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: manage.shayona360.com
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/home/frappe/frappe-bench/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/home/frappe/frappe-bench/logs
    ports:
      - "127.0.0.1:8080:8080"

  # Angular YOB storefront: serves the pre-built yob_frontend dist only.
  # The build ZIP is downloaded/extracted on the host; Node/npm are not required here.
  yob_frontend:
    image: nginx:stable-alpine
    networks:
      - frappe_network
    depends_on:
      - frontend
    restart: unless-stopped
    environment:
      FRAPPE_UPSTREAM: frontend:8080
      FRAPPE_SITE_HOST: manage.shayona360.com
      # Only substitute the two variables above; preserve nginx variables such as $host.
      NGINX_ENVSUBST_FILTER: "FRAPPE_UPSTREAM|FRAPPE_SITE_HOST"
    volumes:
      - ${HOST_YOB_FRONTEND:-/srv/projects/shayona360/yob_frontend}/dist:/usr/share/nginx/html:ro
      - ${HOST_YOB_FRONTEND:-/srv/projects/shayona360/yob_frontend}/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8082:80"

  queue-long:
    image: yob/frappe-erpindiahrmscrm:v16
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/home/frappe/frappe-bench/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  queue-short:
    image: yob/frappe-erpindiahrmscrm:v16
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/home/frappe/frappe-bench/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: on-failure
    volumes:
      - ${HOST_REDISQ:-/srv/projects/shayona360/redis-queue-data}:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: on-failure

  scheduler:
    image: yob/frappe-erpindiahrmscrm:v16
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - schedule
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/home/frappe/frappe-bench/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/home/frappe/frappe-bench/logs

  websocket:
    image: yob/frappe-erpindiahrmscrm:v16
    networks:
      - frappe_network
    restart: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - ${HOST_SITES:-/srv/projects/shayona360/sites}:/home/frappe/frappe-bench/sites
      - ${HOST_LOGS:-/srv/projects/shayona360/logs}:/home/frappe/frappe-bench/logs

# no named Docker volumes now – everything is on host
volumes: {}

networks:
  frappe_network:
    driver: bridge
